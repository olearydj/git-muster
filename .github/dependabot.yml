version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    groups:
      python-dependencies:
        patterns: ["*"]
    # A major bump is proposed by widening the bounds declared in pyproject.toml.
    # Those bounds are a deliberate choice, so majors are raised by hand instead.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
