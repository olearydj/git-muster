name: Publish to PyPI

run-name: Publish ${{ github.event.release.tag_name || inputs.tag }} to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to build and publish
        required: true
        type: string
      assets_only:
        description: Skip PyPI and only reattach the verified archives to the release
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: publish-pypi-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-distributions:
    name: Verify release tag and distributions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      UV_PYTHON: "3.14"
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release identity
        shell: sh
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "unsupported release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          version=${RELEASE_TAG#v}
          project_version=$(
            python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])'
          )
          test "$project_version" = "$version"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"

      - name: Confirm a published release owns the tag
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          published_tag=$(
            gh release view "$RELEASE_TAG" --json tagName,isDraft \
              --jq 'select(.isDraft == false) | .tagName'
          )
          test "$published_tag" = "$RELEASE_TAG"

      - name: Install uv
        if: ${{ !inputs.assets_only }}
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install locked dependencies
        if: ${{ !inputs.assets_only }}
        run: uv sync --locked --all-groups

      - name: Verify source
        if: ${{ !inputs.assets_only }}
        run: |
          uv run --locked pytest
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked ty check

      - name: Build distributions
        if: ${{ !inputs.assets_only }}
        run: uv build

      - name: Verify distribution contract
        if: ${{ !inputs.assets_only }}
        shell: sh
        run: |
          version=${RELEASE_TAG#v}
          wheel="dist/git_muster-$version-py3-none-any.whl"
          sdist="dist/git_muster-$version.tar.gz"
          find dist -maxdepth 1 -type f -print
          test -f "$wheel"
          test -f "$sdist"
          archive_count=$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l | tr -d ' ')
          test "$archive_count" = "2"
          test "$(uv tool run --from "./$wheel" git-muster --version)" = "git-muster $version"

      - name: Store verified distributions
        if: ${{ !inputs.assets_only }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: |
            dist/git_muster-*.whl
            dist/git_muster-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions
    needs: verify-distributions
    # PyPI files are immutable, so a version it already holds is never republished.
    # Use assets_only to recover a failed asset upload without touching PyPI.
    if: ${{ !inputs.assets_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/git-muster
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach-release-assets:
    name: Attach published distributions to the release
    needs: [verify-distributions, publish]
    if: >-
      ${{ always()
      && needs.verify-distributions.result == 'success'
      && needs.publish.result != 'failure'
      && needs.publish.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Retrieve the distributions this run published
        if: ${{ !inputs.assets_only }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist

      # A recovery run publishes nothing, so it must attach the files PyPI already
      # serves. Rebuilding from the tag can differ in build metadata and would
      # recreate the divergence the run exists to repair.
      # Checks out the dispatched ref, not the release tag: this script is CI
      # tooling rather than release content, and tags published before it existed
      # must stay recoverable.
      - name: Check out the recovery script
        if: ${{ inputs.assets_only }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the published distributions from PyPI
        if: ${{ inputs.assets_only }}
        shell: sh
        run: python3 .github/scripts/download_release_distributions.py "${RELEASE_TAG#v}" dist

      - name: Replace the release archives with the published ones
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/git_muster-* --clobber
