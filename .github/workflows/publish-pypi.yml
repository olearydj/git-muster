name: Publish to PyPI

run-name: Publish ${{ github.event.release.tag_name || inputs.tag }} to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish or retry
        required: true
        type: string

permissions: {}

jobs:
  verify-distributions:
    name: Verify release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      UV_PYTHON: "3.14"
    steps:
      - name: Check out release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release identity
        shell: sh
        run: |
          case "$RELEASE_TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "unsupported release tag: $RELEASE_TAG" >&2
              exit 1
              ;;
          esac
          version=${RELEASE_TAG#v}
          project_version=$(
            python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])'
          )
          test "$project_version" = "$version"
          test "$(git describe --tags --exact-match)" = "$RELEASE_TAG"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify source
        run: |
          uv run --locked pytest
          uv run --locked ruff format --check .
          uv run --locked ruff check .
          uv run --locked ty check

      - name: Build distributions
        run: uv build

      - name: Verify distribution contract
        shell: sh
        run: |
          version=${RELEASE_TAG#v}
          wheel="dist/git_muster-$version-py3-none-any.whl"
          sdist="dist/git_muster-$version.tar.gz"
          test -f "$wheel"
          test -f "$sdist"
          test "$(find dist -type f | wc -l | tr -d ' ')" = "2"
          test "$(uv tool run --from "$wheel" git-muster --version)" = "git-muster $version"

      - name: Store verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pypi-distributions
          path: |
            dist/git_muster-*.whl
            dist/git_muster-*.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified distributions
    needs: verify-distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/git-muster
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions
          path: dist

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
